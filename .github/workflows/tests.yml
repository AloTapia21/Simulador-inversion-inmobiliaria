name: Tests

on:
  push:
  pull_request:

jobs:
  streamlit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q streamlit
      - name: Run unit tests
        run: python -m unittest discover -s streamlit/tests -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: html/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
